server {
    listen 80;
    server_name alphawolf.laopioneer.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name alphawolf.laopioneer.com;

    ssl_certificate /etc/letsencrypt/live/alphawolf.laopioneer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alphawolf.laopioneer.com/privkey.pem;

    location / {
        proxy_pass http://boardgames-frontend:80;
        proxy_set_header Host $host;
    }
}