server {
    listen 80;
    server_name bid.laopioneer.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bid.laopioneer.com;

    ssl_certificate /etc/letsencrypt/live/bid.laopioneer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bid.laopioneer.com/privkey.pem;

    location /api/ {
        proxy_pass http://bid-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://bid-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}